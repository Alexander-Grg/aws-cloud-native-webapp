---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: webapp-gateway
  namespace: webapp
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-route
  namespace: webapp
spec:
  parentRefs:
  - name: webapp-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-flask-service
      port: 4567
      group: ""
      kind: Service
      weight: 1
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-react-js
      port: 80
      group: ""
      kind: Service
      weight: 1