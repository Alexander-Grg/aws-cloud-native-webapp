          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"webapp\", pod=~\"flask-backend.*\"}[5m])) by (pod)",
