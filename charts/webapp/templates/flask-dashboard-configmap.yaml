          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"webapp\", pod=~\"flask-backend.*\"}) by (pod)",
