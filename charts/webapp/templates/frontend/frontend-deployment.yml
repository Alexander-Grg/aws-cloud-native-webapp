apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-react-js
  namespace: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-react-js
  template:
    metadata:
      labels:
        app: frontend-react-js
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.ecr_registry }}/frontend-react-js:{{ .Values.frontend_image_tag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_AWS_PROJECT_REGION
          value: {{ .Values.AWS_DEFAULT_REGION | quote }}
        - name: REACT_APP_AWS_COGNITO_REGION
          value: {{ .Values.AWS_DEFAULT_REGION | quote }}
        - name: REACT_APP_AWS_USER_POOLS_ID
          value: {{ .Values.cognito_user_pool_id | quote }}
        - name: REACT_APP_CLIENT_ID
          value: {{ .Values.cognito_client_id | quote }}
        - name: REACT_APP_BACKEND_URL
          value: {{ .Values.backend_url | quote }}
        - name: WDS_SOCKET_PORT
          value: {{ .Values.WDS_SOCKET_PORT | quote }}
