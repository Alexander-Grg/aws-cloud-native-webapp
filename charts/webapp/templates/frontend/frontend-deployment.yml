apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-react-js
  namespace: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-react-js
  template:
    metadata:
      labels:
        app: frontend-react-js
    spec:
      containers:
      - name: frontend
        image: frontend-react:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_AWS_PROJECT_REGION
          value: {{ .Values.AWS_DEFAULT_REGION | quote }}
        - name: REACT_APP_AWS_COGNITO_REGION
          value: {{ .Values.AWS_DEFAULT_REGION | quote }}
        - name: REACT_APP_AWS_USER_POOLS_ID
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: AWS_COGNITO_USER_POOL_ID
        - name: REACT_APP_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: AWS_COGNITO_USER_POOL_CLIENT_ID
        - name: REACT_APP_BACKEND_URL
          value: {{ .Values.backend_url | quote }}
        - name: WDS_SOCKET_PORT
          value: {{ .Values.WDS_SOCKET_PORT | quote }}
