apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secret-connection
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.AWS_DEFAULT_REGION | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: kube-system