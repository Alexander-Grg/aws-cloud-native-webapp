---
- name: Configure and Deploy Full Stack App
  hosts: app_server
  become: true
  gather_facts: true
  vars:
    app_dir: /opt/app
    app_user: ubuntu
    aws_region: ap-southeast-2
    secret_name: "webapp-rds-credentials"
    ssl_cert_content: ""
    ssl_key_content: ""

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name: [python3-pip, unzip, jq, docker.io, python3-docker, acl]
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install AWS CLI v2
      block:
        - name: Check if AWS CLI is installed
          command: aws --version
          register: aws_cli_check
          ignore_errors: true
          changed_when: false
        
        - name: Download and Install AWS CLI
          shell: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -o awscliv2.zip
            ./aws/install --update
          args:
            chdir: /tmp
          when: aws_cli_check.rc != 0

    - name: Install NGINX
      apt:
        name: nginx
        state: present

    - name: Create SSL Directory
      file:
        path: /etc/nginx/ssl
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Write SSL Certificate
      copy:
        dest: /etc/nginx/ssl/server.crt
        content: "{{ ssl_cert_content }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload NGINX

    - name: Write SSL Private Key
      copy:
        dest: /etc/nginx/ssl/server.key
        content: "{{ ssl_key_content }}"
        owner: root
        group: root
        mode: '0600'
      notify: Reload NGINX

    - name: Create app directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/logs"
        - "{{ app_dir }}/config"

    - name: Login to ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | \
        docker login --username AWS --password-stdin {{ ecr_registry }}
      become_user: "{{ app_user }}"

    - name: Create Docker network
      docker_network:
        name: app-network
        state: present

    - name: Pull Backend Image
      docker_image:
        name: "{{ ecr_registry }}/{{ backend_repo }}:{{ image_tag }}"
        source: pull
        force_source: yes
      become_user: "{{ app_user }}"

    - name: Stop and remove old Backend container
      docker_container:
        name: backend-app
        state: absent
      ignore_errors: true

    - name: Fetch DB Credentials
      set_fact:
        db_secrets: "{{ lookup('amazon.aws.aws_secret', secret_name, region=aws_region) | from_json }}"

    - name: Create environment file
      copy:
        dest: "{{ app_dir }}/.env"
        content: |
          DB_HOST={{ db_secrets.host }}
          DB_PORT={{ db_secrets.port }}
          DB_NAME={{ db_secrets.dbname }}
          DB_USER={{ db_secrets.username }}
          DB_PASSWORD={{ db_secrets.password }}
          AWS_REGION={{ aws_region }}
          FRONTEND_URL=https://{{ ansible_default_ipv4.address }}
          BACKEND_URL=https://{{ ansible_default_ipv4.address }}
          NODE_ENV={{ environment | default('production') }}             
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'

    - name: Run Backend Container
      docker_container:
        name: backend-app
        image: "{{ ecr_registry }}/{{ backend_repo }}:{{ image_tag }}"
        state: started
        restart_policy: always
        ports:
          - "127.0.0.1:4567:4567"
        env_file: "{{ app_dir }}/.env"
        volumes:
          - "{{ app_dir }}/logs:/app/logs"
        networks:
          - name: app-network
        healthcheck:
          test: ["CMD", "python3", "-c", "import urllib.request; print(urllib.request.urlopen('http://localhost:4567/api/health-check').read().decode('utf-8'))"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s

    - name: Pull Frontend Image
      docker_image:
        name: "{{ ecr_registry }}/{{ frontend_repo }}:{{ image_tag }}"
        source: pull
        force_source: yes
      become_user: "{{ app_user }}"

    - name: Stop and remove old Frontend container
      docker_container:
        name: frontend-app
        state: absent
      ignore_errors: true

    - name: Run Frontend Container
      docker_container:
        name: frontend-app
        image: "{{ ecr_registry }}/{{ frontend_repo }}:{{ image_tag }}"
        state: started
        restart_policy: always
        ports:
          - "127.0.0.1:3000:3000"
        networks:
          - name: app-network

    - name: Create NGINX Configuration (Split Traffic)
      copy:
        dest: /etc/nginx/sites-available/webapp
        content: |
          server {
              listen 80;
              server_name _;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name _;
              
              ssl_certificate     /etc/nginx/ssl/server.crt;
              ssl_certificate_key /etc/nginx/ssl/server.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;
              
              # Proxy Headers
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;

              # 1. Route API requests to Backend (Flask)
              location /api/ {
                  proxy_pass http://127.0.0.1:4567;
              }

              # 2. Route all other requests to Frontend (React)
              location / {
                  proxy_pass http://127.0.0.1:3000;
              }
          }
        owner: root
        group: root
        mode: '0644'
      notify: Reload NGINX

    - name: Enable NGINX site
      file:
        src: /etc/nginx/sites-available/webapp
        dest: /etc/nginx/sites-enabled/webapp
        state: link
        force: true
      notify: Reload NGINX

    - name: Remove default NGINX site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload NGINX

    - name: Remove old backend-only config
      file:
        path: /etc/nginx/sites-enabled/backend-flask
        state: absent
      notify: Reload NGINX

    - name: Ensure NGINX is running
      systemd:
        name: nginx
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Verify Backend status
      shell: docker ps --filter "name=backend-app" --format "{{ '{{' }}.Status{{ '}}' }}"
      register: backend_status
      changed_when: false

    - name: Verify Frontend status
      shell: docker ps --filter "name=frontend-app" --format "{{ '{{' }}.Status{{ '}}' }}"
      register: frontend_status
      changed_when: false

    - name: Force NGINX restart to ensure SSL listener is active
      systemd:
        name: nginx
        state: restarted
        enabled: yes

    - name: Check Backend API Health (HTTPS)
      uri:
        url: "https://localhost/api/health-check"
        status_code: 200
        validate_certs: no
      register: api_health
      until: api_health.status == 200
      retries: 10
      delay: 5

    - name: Check Frontend Health (HTTPS)
      uri:
        url: "https://localhost/"
        status_code: 200
        validate_certs: no
      register: web_health
      until: web_health.status == 200
      retries: 10
      delay: 5

    - debug:
        msg: 
          - "Backend Status: {{ backend_status.stdout }}"
          - "Frontend Status: {{ frontend_status.stdout }}"
          - "API Health: {{ api_health.status }} OK"
          - "Web Health: {{ web_health.status }} OK"

  handlers:
    - name: Reload NGINX
      service:
        name: nginx
        state: reloaded