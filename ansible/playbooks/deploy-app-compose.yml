---
- name: Configure and Deploy Full Stack App (Docker Compose Version)
  hosts: app_server
  become: true
  gather_facts: true
  vars:
    app_dir: /opt/app
    app_user: ubuntu
    secret_name: "webapp-rds-credentials"

  tasks:
    - name: Ensure 2GB swap file exists
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      changed_when: false

    - name: Remove conflicting Docker packages
      apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: yes 

    - name: Install system dependencies for Docker
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - python3-docker
          - jq
          - unzip
        state: present
        update_cache: yes

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker Engine and Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker is enabled
      systemd: { name: docker, state: started, enabled: yes }

    - name: Create SSL Directory
      file: { path: /etc/nginx/ssl, state: directory, mode: '0700' }

    - name: Write SSL Files
      copy:
        dest: "/etc/nginx/ssl/server.{{ item.ext }}"
        content: "{{ item.content }}"
        mode: "{{ item.mode }}"
      loop:
        - { ext: 'crt', content: "{{ ssl_cert_content }}", mode: '0644' }
        - { ext: 'key', content: "{{ ssl_key_content }}", mode: '0600' }
      notify: Reload NGINX

    - name: Create App Directory
      file: { path: "{{ app_dir }}", state: directory, owner: "{{ app_user }}" }

    - name: Login to ECR
      shell: "aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry }}"
      become_user: "{{ app_user }}"
      changed_when: false

    - name: Fetch DB Credentials from AWS Secrets Manager
      set_fact:
        db_secrets: "{{ lookup('amazon.aws.aws_secret', secret_name, region=aws_region) | from_json }}"

    - name: Template Docker Compose File
      template:
        src: templates/docker-compose.prod.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        mode: '0644'

    - name: Create .env file for Docker Compose
      copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        mode: '0600'
        content: |
          ECR_REGISTRY={{ ecr_registry }}
          ECR_BACKEND_REPO={{ backend_repo }}
          ECR_FRONTEND_REPO={{ frontend_repo }}
          IMAGE_TAG={{ image_tag }}
          AWS_REGION={{ aws_region }}
          AWS_DEFAULT_REGION={{ aws_region }}
          AWS_ACCESS_KEY_ID={{ aws_access_key }}
          AWS_SECRET_ACCESS_KEY={{ aws_secret_key }}
          AWS_COGNITO_USER_POOL_ID={{ cognito_user_pool_id }}
          AWS_COGNITO_USER_POOL_CLIENT_ID={{ cognito_client_id }}
          CONNECTION_STRING=postgresql://{{ db_secrets.username }}:{{ db_secrets.password }}@{{ db_secrets.host }}:{{ db_secrets.port }}/{{ db_secrets.dbname }}
          PROD_CONNECTION_STRING=postgresql://{{ db_secrets.username }}:{{ db_secrets.password }}@{{ db_secrets.host }}:{{ db_secrets.port }}/{{ db_secrets.dbname }}
          FRONTEND_URL=https://{{ ansible_default_ipv4.address }}
          BACKEND_URL=https://{{ ansible_default_ipv4.address }}

    - name: Deploy Services via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: always
      become_user: "{{ app_user }}"

    - name: Configure NGINX Reverse Proxy
      copy:
        dest: /etc/nginx/sites-available/webapp
        content: |
          server {
              listen 80;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl;
              ssl_certificate     /etc/nginx/ssl/server.crt;
              ssl_certificate_key /etc/nginx/ssl/server.key;
              
              # Proxy API to Flask
              location /api/ { 
                  proxy_pass http://127.0.0.1:4567;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
              
              # Proxy Main to React (Nginx Container)
              location / { 
                  proxy_pass http://127.0.0.1:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
      notify: Reload NGINX

    - name: Enable Site and Remove Defaults
      file:
        src: /etc/nginx/sites-available/webapp
        dest: /etc/nginx/sites-enabled/webapp
        state: link
      notify: Reload NGINX

    - name: Remove default Nginx site
      file: { path: /etc/nginx/sites-enabled/default, state: absent }
      notify: Reload NGINX

  handlers:
    - name: Reload NGINX
      service: { name: nginx, state: reloaded }